<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRISHTI — Cyber Command & Threat Intelligence</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Tailwind CSS with Soft Neumorphic / Violet Modern Design Tokens -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // Lavender-and-Violet Enterprise SaaS Palette
              "canvas": "#F4F1FF",
              "canvas-subtle": "#EDE8FF",
              "surface": "#FFFFFF",
              "surface-subtle": "#FAF9FF",
              "primary-violet": "#6C4CF1",
              "hover-violet": "#5940D8",
              "soft-violet": "#EAE4FF",
              "pale-violet": "#F3F0FF",
              "text-primary": "#22213A",
              "text-secondary": "#77758E",
              "text-muted": "#9896AA",
              "app-border": "#E8E4F2",
              "critical-red": "#DC4655",
              "critical-bg": "#FFF0F1",
              "success-green": "#299B75",
              "success-bg": "#EAF8F1",
              "warning-amber": "#C78A27",
              "warning-bg": "#FFF7E8",
              "info-blue": "#5279D9",
            },
            borderRadius: {
              "md": "10px",
              "lg": "12px",
              "xl": "16px",
              "2xl": "20px",
              "3xl": "24px",
              "full": "9999px"
            },
            boxShadow: {
              "soft": "0 8px 24px rgba(108, 76, 241, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02)",
              "soft-hover": "0 12px 32px rgba(108, 76, 241, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03)",
              "elevated": "0 16px 40px rgba(34, 33, 58, 0.06)",
              "violet-glow": "0 4px 16px rgba(108, 76, 241, 0.25)",
            },
            fontFamily: {
              sans: ["Plus Jakarta Sans", "Inter", "-apple-system", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#F4F1FF] text-[#22213A] min-h-screen flex overflow-hidden antialiased">
    <div id="root" class="w-full h-full flex"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
