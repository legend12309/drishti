<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DRISHTI // SEC-OPS-09 — Cyber Intelligence & Attack Surface Cockpit</title>
    <!-- Google Fonts & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Tailwind CSS with High-Tech Light Hacker Cyber Lab Palette -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              // High-Tech Cyber Lab / Light Hacker Palette
              bone: '#F4F6F9',          // Clean Technical Lab Canvas Background
              boneDark: '#EAEFF5',      // Elevated Technical Surface (Headers, Sub-strips)
              boneLight: '#F0F4F8',     // Sub-surface / Badges / Input Backings
              pureWhite: '#FFFFFF',     // Pure White Crisp Card Surface
              ink: '#090D16',           // Deep Technical Ink Black (Ultra-legible)
              inkMuted: '#1E293B',      // Secondary High-Contrast Text
              charcoal: '#475569',      // Technical Slate / Telemetry Labels
              pencil: '#64748B',        // Muted Metadata & Dim Details
              hairline: '#0F172A',      // 1px Razor-Sharp Technical Drafting Border
              hairlineLight: '#CBD5E1', // Subtle Internal Separation Hairline
              vermilion: '#DC2626',     // High-Visibility Tactical Threat Red
              crimson: '#B91C1C',       // Darker Threat Crimson
              signalGreen: '#008744',   // High-Contrast Matrix Phosphor Green
              signalGreenBg: '#E8F5E9', // Light Green Status Badge Backing
              cyan: '#0284C7',          // Cobalt Cyber Blue / Route Telemetry
              cyanBg: '#E0F2FE',        // Light Blue Badge Backing
              amber: '#D97706',         // Warning Amber
              // Legacy mappings
              "canvas": "#F4F6F9",
              "canvas-subtle": "#EAEFF5",
              "surface": "#FFFFFF",
              "surface-subtle": "#F0F4F8",
              "primary-violet": "#008744",
              "hover-violet": "#0284C7",
              "soft-violet": "#EAEFF5",
              "pale-violet": "#F0F4F8",
              "text-primary": "#090D16",
              "text-secondary": "#475569",
              "text-muted": "#64748B",
              "app-border": "#0F172A",
              "critical-red": "#DC2626",
              "critical-bg": "#FEE2E2",
              "success-green": "#008744",
              "success-bg": "#E8F5E9",
              "warning-amber": "#D97706",
              "warning-bg": "#FEF3C7",
              "info-blue": "#0284C7",
            },
            fontFamily: {
              mono: ['JetBrains Mono', 'Courier New', 'Consolas', 'monospace'],
              grotesk: ['Space Grotesk', 'Barlow Condensed', 'sans-serif'],
              condensed: ['Barlow Condensed', 'Space Grotesk', 'sans-serif'],
              sans: ['Space Grotesk', 'JetBrains Mono', 'sans-serif'],
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-bone text-ink min-h-screen flex overflow-hidden antialiased select-none font-mono">
    <div id="root" class="w-full h-full flex bg-bone text-ink"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
